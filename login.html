<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookEasy · Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
</head>
<body>
  <main class="be-login-page">
    <div class="be-brand mb-4"><span class="be-brand-logo"><i class="bi bi-calendar-check"></i></span>BookEasy</div>

    <div class="be-login-card">
      <h1 class="mb-1">Connexion</h1>
      <p class="be-muted text-center mb-4">Réservation de salles simplifiée pour les campus ECE</p>

      <span class="form-label d-block">Je me connecte en tant que</span>
      <div class="d-flex flex-wrap gap-2 mb-3" id="roles"></div>

      <button class="btn btn-outline-secondary w-100" id="sso" type="button"><i class="bi bi-shield-lock"></i>Se connecter avec le SSO ECE</button>

      <div class="be-or">ou avec vos identifiants</div>

      <form id="form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Adresse e-mail ECE</label>
          <div class="be-field"><i class="bi bi-envelope"></i>
            <input id="email" type="email" class="form-control" placeholder="prenom.nom@ece.fr" autocomplete="username" required></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="mdp">Mot de passe</label>
          <div class="be-field"><i class="bi bi-lock"></i>
            <input id="mdp" type="password" class="form-control" autocomplete="current-password" required>
            <button class="be-field-action" id="voir" type="button" aria-label="Afficher le mot de passe"><i class="bi bi-eye"></i></button></div>
        </div>
        <div id="erreur" class="be-alert be-alert-danger mb-3 d-none" role="alert"><i class="bi bi-exclamation-circle"></i><span id="erreurTexte"></span></div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Se connecter</button>
      </form>

      <p class="text-center mt-3 mb-0"><a href="reserver-salle.html">Continuer en invité</a></p>
      <p class="be-small text-center mt-3 mb-0">Démonstration : mot de passe ece2026. Aucune donnée réelle n’est transmise.</p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const COMPTES = [
      { role: "etudiant", libelle: "Étudiant", email: "louise.martin@ece.fr" },
      { role: "enseignant", libelle: "Enseignant", email: "marc.lefebvre@ece.fr" },
      { role: "gestionnaire", libelle: "Gestionnaire", email: "sofia.benali@ece.fr" },
      { role: "admin", libelle: "Administrateur", email: "claire.dupont@ece.fr" }
    ];
    let compte = COMPTES[0];

    function afficherRoles() {
      $("roles").innerHTML = COMPTES.map(c =>
        `<button type="button" class="be-chip ${c === compte ? "active" : ""}" data-role="${c.role}" aria-pressed="${c === compte}">${c.libelle}</button>`).join("");
    }

    function erreur(message) {
      $("erreurTexte").textContent = message;
      $("erreur").classList.toggle("d-none", !message);
    }

    async function entrer(email, mdp) {
      erreur("");
      if (!/^[^@\s]+@ece\.fr$/i.test(email)) return erreur("Saisissez votre adresse e-mail se terminant par @ece.fr.");
      if (!mdp) return erreur("Saisissez votre mot de passe.");
      let reponse;
      try { reponse = await connecter(email, mdp); } catch (e) { reponse = false; }
      const user = utilisateurCourant();
      if (reponse === false || (reponse && reponse.ok === false) || !user || user.email.toLowerCase() !== email.toLowerCase())
        return erreur("Identifiants incorrects. Vérifiez votre adresse e-mail et votre mot de passe.");
      location.href = "reserver-salle.html";
    }

    $("roles").addEventListener("click", e => {
      const b = e.target.closest("[data-role]"); if (!b) return;
      compte = COMPTES.find(c => c.role === b.dataset.role);
      $("email").value = compte.email; $("mdp").value = "ece2026";
      erreur(""); afficherRoles();
    });
    $("sso").addEventListener("click", () => entrer(compte.email, "ece2026"));
    $("form").addEventListener("submit", e => { e.preventDefault(); entrer($("email").value.trim(), $("mdp").value); });
    $("voir").addEventListener("click", () => {
      const cache = $("mdp").type === "password";
      $("mdp").type = cache ? "text" : "password";
      $("voir").firstElementChild.className = cache ? "bi bi-eye-slash" : "bi bi-eye";
    });
    afficherRoles();
  </script>
</body>
</html>
